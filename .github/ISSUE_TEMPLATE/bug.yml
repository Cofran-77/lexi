name: 缺陷反馈 / Bug report
description: 提供可复现步骤、平台版本和脱敏证据
body:
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - macOS
        - Android
        - 文档或发布资产
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本与系统版本
      placeholder: Lexi 3.3.1 / Windows 11 24H2，或 Lexi 3.3.1 / macOS 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期与实际行为
      description: 请使用最小示例，不要附真实学习档案或完整用户数据库。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 不上传个人词库、账号、Cookie、Session、API Key、签名材料或教材录音。
