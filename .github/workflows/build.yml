name: Build source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test FSRS optimizer
        run: cargo test --locked --manifest-path windows/native/fsrs-optimizer/Cargo.toml
      - name: Compile Windows source
        run: dotnet build windows/Lexi.csproj -c Release
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify preserved source and release identity
        run: python3 macos/scripts/verify_source_integrity.py
      - name: Compile macOS source
        run: dotnet build macos/lexi_avalonia/Lexi.csproj -c Release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble preview (not real-device certification)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
